[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "stockanalysis-ml"
version = "0.1.0"
description = "Stock market analysis with machine learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deepspeed>=0.17.1",
    "einops>=0.8.1",
    "finta>=1.3",
    "flask>=2.3.2",
    "flask-socketio>=5.3.4",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "prettytable>=3.8.0",
    "scikit-learn>=1.5.2",
    "torch>=2.0.1",
    "torchvision>=0.15.2",
    "tqdm>=4.65.0",
    "dotenv",
]
keywords = [
    "technical analysis",
    "ta",
    "pandas",
    "finance",
    "numpy",
    "analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
authors = [{ name = "dqchuang", email = "dqchuang@outlook.com" }]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
stockml-train = "stockml.Trainer:main_cmd"

[project.urls]
Homepage = "https://github.com/davidqchuang/stockanalysis-ml"
Issues = "https://github.com/davidqchuang/stockanalysis-ml/issues" 

[project.optional-dependencies]
gui = ["pyqt6>=6.7.0", "pyqtgraph>=0.13.7"]

[tool.uv]
dev-dependencies = [
    "ruff"
]

[tool.ruff.lint]
select = [
    # darglint
    "D",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort"
    "I"
]
ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
    "D203", # incorrect-blank-line-before-class
    "D212", # multi-line-summary-first-line
    "F403", # undefined-local-with-import-star
    "UP031", # Use format specifiers instead of percent format
]

[tool.isort]
known_first_party = ["stockml"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D104","D205"]